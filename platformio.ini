[env:esp32]
platform  = espressif32
board     = esp32dev
framework = espidf

; Punta all'ESP-IDF locale invece del registry
platform_packages =
    framework-espidf @ symlink:///Users/nino/esp/esp-idf

upload_port   = /dev/tty.usbserial-0001
monitor_port  = /dev/tty.usbserial-0001
monitor_speed = 115200

board_build.cmake_extra_args =
    -DEXTRA_COMPONENT_DIRS=components


